apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater-controller
data:
  registries.conf: |
    registries:
      - name: aws-ecr
        # Keep prefix to the ECR REGISTRY HOST ONLY for v1.1.1
        # (the repository name comes from the container image reference in your Deployment)
        prefix: 543115429274.dkr.ecr.eu-west-1.amazonaws.com
        credentials: aws
