apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater-controller
data:
  registries.conf: |
    registries:
      - name: aws-ecr
        # Required by v1.1.1
        apiUrl: https://543115429274.dkr.ecr.eu-west-1.amazonaws.com
        # Match the registry host your images use (host only is fine in this version)
        prefix: 543115429274.dkr.ecr.eu-west-1.amazonaws.com
        # Tell the controller to use AWS (IRSA) for credentials
        credentials: aws
